services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: makemyevent
      POSTGRES_PASSWORD: makemyevent
      POSTGRES_DB: makemyevent
    ports:
      - "5434:5432"
    volumes:
      - makemyevent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makemyevent -d makemyevent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  makemyevent_pgdata:
