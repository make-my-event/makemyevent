name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: makemyevent_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/makemyevent_ci
      DIRECT_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/makemyevent_ci
      RUN_DB_TESTS: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Placeholders: nothing in CI talks to a real Supabase project.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_placeholder_for_ci
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_ci
      RESEND_API_KEY: test-resend-api-key
      EMAIL_FROM: test@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and format (Biome)
        run: pnpm biome ci .

      - name: Prisma schema valid and client generated
        run: |
          pnpm --filter @makemyevent/db exec prisma validate
          pnpm --filter @makemyevent/db exec prisma generate

      - name: Migrations build a fresh DB that matches schema.prisma
        run: |
          pnpm --filter @makemyevent/db exec prisma migrate deploy
          pnpm --filter @makemyevent/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm -r --if-present test

      - name: Build web
        run: pnpm --filter @makemyevent/web build