name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: makemyevent_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Rate limits are tested against a real Redis.
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://localhost:6379
      # As deployed: the app's own login, which the migrations make, and the
      # owner for migrations alone.
      DATABASE_URL: postgresql://app_login:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/makemyevent_ci
      DIRECT_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/makemyevent_ci
      RUN_DB_TESTS: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Placeholders: nothing in CI talks to a real Supabase project.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_placeholder_for_ci
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_ci
      RESEND_API_KEY: test-resend-api-key
      EMAIL_FROM: test@example.com

    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads the commits this change adds.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gitleaks program itself, pinned and checksum-verified. (The
      # gitleaks GitHub Action needs a paid licence on organisation repos.)
      # Only this change's own commits are scanned: a pull request's, or a
      # push's new ones.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          # A new branch's first push has no "before": scan what it adds over
          # development.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base origin/development "$HEAD" || git rev-list --max-parents=0 "$HEAD" | tail -1)
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$BASE..$HEAD" .

      - name: Lint and format (Biome)
        run: pnpm biome ci .

      - name: Prisma schema valid and client generated
        run: |
          pnpm --filter @makemyevent/db exec prisma validate
          pnpm --filter @makemyevent/db exec prisma generate

      - name: Migrations build a fresh DB that matches schema.prisma
        run: |
          psql "$DIRECT_URL" -X -v ON_ERROR_STOP=1 -f packages/db/checks/supabase-roles.sql
          pnpm --filter @makemyevent/db exec prisma migrate deploy
          pnpm --filter @makemyevent/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: app_user can insert every column Prisma sends
        run: psql "$DIRECT_URL" -X -v ON_ERROR_STOP=1 -f packages/db/checks/insert-grants.sql

      - name: Nothing is open to Supabase's web API or to the app's bare login
        run: psql "$DIRECT_URL" -X -v ON_ERROR_STOP=1 -f packages/db/checks/api-access.sql

      - name: The app's login can only become app_user
        env:
          LOGIN_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          psql "$DIRECT_URL" -X -v ON_ERROR_STOP=1 -v password="$LOGIN_PASSWORD" \
            <<< "ALTER ROLE app_login PASSWORD :'password'"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f packages/db/checks/app-login.sql

      - name: Row-level security on guests
        run: psql "$DIRECT_URL" -X -v ON_ERROR_STOP=1 -f packages/db/checks/guest-access.sql

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm -r --if-present test

      - name: Build web
        run: pnpm --filter @makemyevent/web build